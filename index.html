<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172554">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="규림's Schedule">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>규림's Schedule</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f3f5f9}
*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:#172554;color:white;padding:25px 20px 22px;border-radius:0 0 24px 24px}
header small{opacity:.75}h1{margin:5px 0;font-size:27px}.date{font-size:14px;opacity:.85}
main{max-width:680px;margin:auto;padding:16px}
.panel{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 15px #1c2d4a0c}
h2{font-size:17px;margin:0 0 13px}
input,select,textarea{width:100%;padding:13px;border:1px solid #d9deea;border-radius:11px;font-size:16px;background:white;color:#172033}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin:9px 0}.field label{display:block;font-size:12px;color:#65718a;margin:0 0 6px}
button{border:0;border-radius:12px;padding:13px 15px;font-size:15px;font-weight:650;background:#1d4ed8;color:white;cursor:pointer}
button.secondary{background:#e9eefb;color:#1e3a8a}button.danger{background:#fff0f0;color:#b42318}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}
.item{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #edf0f5}.item:last-child{border:0}
.item .body{flex:1;min-width:0}.item strong{display:block;font-size:15px;overflow-wrap:anywhere}.meta{font-size:12px;color:#6b7589;margin-top:5px}
.item.done strong{text-decoration:line-through;color:#929aaa}
.pill{display:inline-block;background:#eaf0ff;color:#2445a0;padding:4px 8px;border-radius:99px;font-size:11px;margin-top:6px}
.empty{text-align:center;color:#8a93a5;padding:24px 5px;font-size:14px}
#status{font-size:12px;color:#64748b;margin-top:10px;line-height:1.5}
footer{text-align:center;color:#98a1b1;font-size:11px;padding:20px}
</style>
</head>
<body>
<header><small>MY PERSONAL PLANNER</small><h1>규림's Schedule</h1><div class="date" id="today"></div></header>
<main>
<section class="panel" id="cloudPanel">
<h2>클라우드 계정 및 동기화</h2>
<div class="field"><label for="cloudEmail">이메일</label><input id="cloudEmail" type="email" autocomplete="email" placeholder="이메일 주소"></div>
<div class="field"><label for="cloudPassword">비밀번호</label><input id="cloudPassword" type="password" autocomplete="current-password" placeholder="비밀번호 (6자 이상)"></div>
<div class="actions"><button class="secondary" id="cloudSignup" type="button">회원가입</button><button id="cloudLogin" type="button">로그인</button><button class="secondary" id="cloudLogout" type="button" disabled>로그아웃</button></div>
<div class="actions" style="margin-top:10px"><button id="cloudSync" type="button" disabled>☁️ 지금 동기화</button></div>
<div class="actions" style="margin-top:10px"><button class="secondary" id="pushEnable" type="button" disabled>🔔 푸시 알림 켜기</button></div>
<div id="cloudStatus" class="meta">로그인 전에는 일정이 이 기기에만 저장됩니다.</div>
</section>
<section class="panel">
<h2>새 일정 등록</h2>
<div class="field"><label for="title">일정 내용</label><input id="title" placeholder="예: 병원 예약, 운동, 회의"></div>
<div class="grid">
 <div class="field"><label for="date">날짜</label><input id="date" type="date"></div>
 <div class="field"><label for="time">시간</label><input id="time" type="time" value="09:00"></div>
 <div class="field"><label for="repeat">반복</label><select id="repeat"><option value="none">반복 없음</option><option value="daily">매일</option><option value="weekly">매주</option><option value="monthly">매월</option></select></div>
 <div class="field"><label for="lead">알림 시점</label><select id="lead"><option value="0">정시</option><option value="5">5분 전</option><option value="10">10분 전</option><option value="30">30분 전</option><option value="60">1시간 전</option></select></div>
</div>
<div class="actions">
<button class="secondary" id="voiceBtn" type="button">🎙️ 음성 입력</button>
<button id="saveBtn" type="button">일정 저장</button>
</div>
<div id="status">일정은 이 기기의 브라우저 저장소에 보관됩니다. 브라우저 데이터 삭제 시 사라질 수 있습니다.</div>
<div class="actions" style="margin-top:12px">
<button class="secondary" id="backupBtn" type="button">⬇️ 일정 백업하기</button>
<button class="secondary" id="restoreBtn" type="button">⬆️ 백업 파일 가져오기</button>
</div>
<input id="backupFile" type="file" accept="application/json,.json" hidden>
<div class="meta">백업 파일은 JSON 형식입니다. 가져오기는 기존 일정을 지우지 않고 새 일정만 합칩니다.</div>
</section>
<section class="panel">
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2 style="margin:0">등록된 일정</h2><button class="secondary" id="notifyBtn" type="button">알림 권한</button></div>
<div id="list"></div>
</section>
<section class="panel">
<h2>음성 안내 테스트</h2>
<div class="actions"><button class="secondary" id="speakBtn" type="button">🔊 안내 음성 재생</button><button class="secondary" id="installHelp" type="button">아이폰 설치 방법</button></div>
</section>
<footer>규림's Schedule · 개인 일정 관리 앱</footer>
</main>
<script>
const $=id=>document.getElementById(id);
const today=new Date();
const localDate=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)};
$("today").textContent=today.toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
$("date").value=localDate(today);
let entries=JSON.parse(localStorage.getItem("myScheduleEntries")||"[]");
let editing=null;
function persist(){const previous=JSON.parse(localStorage.getItem("myScheduleEntries")||"[]");if(window.scheduleCloudTrackChanges)window.scheduleCloudTrackChanges(previous,entries);localStorage.setItem("myScheduleEntries",JSON.stringify(entries));render()}
function repeatText(v){return ({none:"반복 없음",daily:"매일",weekly:"매주",monthly:"매월"})[v]||v}
function render(){
 const el=$("list");el.innerHTML="";
 const sorted=[...entries].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 if(!sorted.length){el.innerHTML='<div class="empty">아직 등록된 일정이 없습니다.<br>첫 일정을 추가해 보세요.</div>';return}
 sorted.forEach(e=>{
  const div=document.createElement("div");div.className="item"+(e.done?" done":"");
  const check=document.createElement("input");check.type="checkbox";check.checked=!!e.done;check.style.cssText="width:22px;height:22px;margin-top:2px";
  check.onchange=()=>{e.done=check.checked;persist()};
  const body=document.createElement("div");body.className="body";
  const title=document.createElement("strong");title.textContent=e.title;
  const meta=document.createElement("div");meta.className="meta";meta.textContent=`${e.date} ${e.time} · 알림 ${e.lead===0?"정시":e.lead+"분 전"}`;
  const pill=document.createElement("span");pill.className="pill";pill.textContent=repeatText(e.repeat);
  body.append(title,meta,pill);
  const edit=document.createElement("button");edit.className="secondary";edit.textContent="수정";edit.onclick=()=>loadEdit(e.id);
  const del=document.createElement("button");del.className="danger";del.textContent="삭제";del.onclick=()=>{if(confirm("이 일정을 삭제할까요?")){entries=entries.filter(x=>x.id!==e.id);persist()}};
  const tools=document.createElement("div");tools.style.cssText="display:flex;flex-direction:column;gap:5px";tools.append(edit,del);
  div.append(check,body,tools);el.append(div);
 });
}
function loadEdit(id){const e=entries.find(x=>x.id===id);if(!e)return;editing=id;$("title").value=e.title;$("date").value=e.date;$("time").value=e.time;$("repeat").value=e.repeat;$("lead").value=String(e.lead);$("saveBtn").textContent="수정 저장";window.scrollTo({top:0,behavior:"smooth"})}
$("saveBtn").onclick=()=>{
 const title=$("title").value.trim();if(!title){alert("일정 내용을 입력해 주세요.");return}
 const obj={id:editing||crypto.randomUUID(),title,date:$("date").value,time:$("time").value,repeat:$("repeat").value,lead:Number($("lead").value),done:false};
 if(!obj.date||!obj.time){alert("날짜와 시간을 입력해 주세요.");return}
 if(editing){const old=entries.find(x=>x.id===editing);obj.done=old?.done||false;entries=entries.map(x=>x.id===editing?obj:x)}
 else entries.push(obj);
 editing=null;$("title").value="";$("saveBtn").textContent="일정 저장";persist();
};

// JSON 백업: 현재 기기의 일정 데이터를 파일로 내려받습니다.
$("backupBtn").onclick=()=>{
 const backup={app:"GyrimSchedule",version:1,exportedAt:new Date().toISOString(),entries};
 const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");a.href=url;a.download="gyurim-schedule-backup-"+localDate(new Date())+".json";
 document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
 $("status").textContent=entries.length+"개 일정을 백업 파일로 저장했습니다.";
};
$("restoreBtn").onclick=()=>$("backupFile").click();
$("backupFile").onchange=async(event)=>{
 const file=event.target.files?.[0];if(!file)return;
 try{
  const data=JSON.parse(await file.text());
  if(!data||!Array.isArray(data.entries))throw new Error("백업 파일 형식이 올바르지 않습니다.");
  const valid=data.entries.filter(e=>e&&typeof e.id==="string"&&typeof e.title==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)&&/^\d{2}:\d{2}$/.test(e.time));
  if(!valid.length&&data.entries.length)throw new Error("가져올 수 있는 일정 데이터가 없습니다.");
  const ids=new Set(entries.map(e=>e.id));
  const added=valid.filter(e=>!ids.has(e.id));
  entries=entries.concat(added.map(e=>({id:e.id,title:e.title,date:e.date,time:e.time,repeat:["none","daily","weekly","monthly"].includes(e.repeat)?e.repeat:"none",lead:Number.isFinite(Number(e.lead))?Number(e.lead):0,done:!!e.done})));
  persist();
  $("status").textContent=added.length+"개 일정을 가져왔습니다. 기존 일정 "+(entries.length-added.length)+"개는 유지했습니다.";
  alert(added.length+"개 일정을 가져왔습니다. 기존 일정은 삭제하거나 덮어쓰지 않았습니다.");
 }catch(error){alert("백업 파일을 읽지 못했습니다: "+error.message)}
 event.target.value="";
};
$("notifyBtn").onclick=async()=>{
 if(!("Notification"in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return}
 const p=await Notification.requestPermission();$("status").textContent="알림 권한: "+p+(p==="granted"?" · 단, 이 첫 버전은 앱이 열려 있을 때 알림을 확인합니다.":"");
};
let pendingNotificationSpeech=new URLSearchParams(location.search).get("speak");
$("speakBtn").onclick=()=>speak(pendingNotificationSpeech||"규림's Schedule 음성 안내 테스트입니다. 일정 관리 앱이 정상적으로 실행되고 있습니다.");
if(pendingNotificationSpeech){$("speakBtn").textContent="🔊 일정 음성 안내 다시 듣기";$("status").textContent="푸시 알림에서 열린 일정입니다. 음성 안내를 시도합니다. 소리가 나지 않으면 아래 '일정 음성 안내 다시 듣기'를 눌러 주세요.";window.addEventListener("load",()=>setTimeout(()=>speak(pendingNotificationSpeech),900),{once:true});}
function speak(t){if(!("speechSynthesis"in window)){alert("이 브라우저는 음성 읽기를 지원하지 않습니다.");return}speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(t);utterance.lang="ko-KR";utterance.rate=1;utterance.pitch=1;speechSynthesis.speak(utterance)}
$("voiceBtn").onclick=()=>{
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){alert("현재 브라우저에서 음성 입력을 지원하지 않습니다. 일정 내용을 직접 입력해 주세요.");return}
 const r=new SR();r.lang="ko-KR";r.interimResults=false;r.onresult=e=>{$("title").value=e.results[0][0].transcript};r.onerror=()=>alert("음성 인식에 실패했습니다. 마이크 권한을 확인해 주세요.");r.start();
};
$("installHelp").onclick=()=>alert("아이폰에서 Safari로 배포 주소를 연 뒤 공유 버튼 → 홈 화면에 추가 → '웹 앱으로 열기'를 켜고 추가하세요.");
// Foreground-only reminder check for this starter build.
const fired=new Set();
function checkReminders(){
 if(document.visibilityState!=="visible"||localStorage.getItem("mySchedulePushEnabled")==="true")return;
 const now=new Date();
 for(const e of entries){
  if(e.done)continue;
  const [y,m,d]=e.date.split("-").map(Number),[hh,mm]=e.time.split(":").map(Number);
  let target=new Date(y,m-1,d,hh,mm);target.setMinutes(target.getMinutes()-e.lead);
  let key=e.id+"-"+localDate(target)+"-"+target.getHours()+":"+target.getMinutes();
  if(now>=target&&now-target<60000&&!fired.has(key)){
   fired.add(key);
   if("Notification"in window&&Notification.permission==="granted")new Notification("일정 알림",{body:e.title});
   else speak("일정 알림. "+e.title);
  }
 }
}
setInterval(checkReminders,15000);document.addEventListener("visibilitychange",checkReminders);
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
render();
</script>
<script>
(() => {
 const el=id=>document.getElementById(id);
 const URL_BASE="https://ynkhnejglpglvctxpwzi.supabase.co";
 const KEY="sb_publishable_HO8XSk3PoU0YL4ojux0hTg_DVDag3gY";
 const db=window.supabase?.createClient(URL_BASE,KEY);
 const DIRTY="myScheduleDirtyIds", DELETED="myScheduleDeletedIds";
 let user=null, busy=Promise.resolve(), timer=null;
 const read=k=>{try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(_){return []}};
 const write=(k,v)=>localStorage.setItem(k,JSON.stringify([...new Set(v)]));
 const status=t=>{el("cloudStatus").textContent=t};
 const isUuid=s=>/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(s||"");
 function mark(ids,deleted){write(DIRTY,read(DIRTY).concat(ids));write(DELETED,read(DELETED).concat(deleted));if(user){clearTimeout(timer);timer=setTimeout(()=>{busy=busy.then(sync).catch(()=>{});},1200)}}
 window.scheduleCloudTrackChanges=(before,after)=>{
   const b=new Map((before||[]).map(x=>[x.id,x])); const a=new Map((after||[]).map(x=>[x.id,x]));
   const dirty=[]; const deleted=[];
   for(const [id,item] of a){const prior=b.get(id);if(!prior||JSON.stringify(prior)!==JSON.stringify(item))dirty.push(id)}
   for(const id of b.keys())if(!a.has(id))deleted.push(id);
   if(dirty.length||deleted.length)mark(dirty,deleted);
 };
 function authState(session){user=session?.user||null;["cloudSignup","cloudLogin","cloudEmail","cloudPassword"].forEach(id=>el(id).disabled=!!user);el("cloudLogout").disabled=!user;el("cloudSync").disabled=!user;el("pushEnable").disabled=!user;status(user?"로그인됨: "+user.email+" · 변경 사항은 자동 동기화 대기 중":"로그인 전에는 이 기기에만 저장됩니다.");if(user){busy=busy.then(sync).catch(()=>{});}}
 function urlBase64ToUint8Array(base64String){const padding="=".repeat((4-base64String.length%4)%4);const raw=atob((base64String+padding).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));}
 el("pushEnable").onclick=async()=>{
   const button=el("pushEnable");button.disabled=true;
   try{
     if(!user)throw new Error("먼저 로그인해 주세요.");
     if(!("serviceWorker" in navigator)||!("PushManager" in window))throw new Error("이 브라우저는 웹 푸시를 지원하지 않습니다. iPhone은 Safari에서 홈 화면에 설치한 앱으로 실행해 주세요.");
     if(!("Notification" in window))throw new Error("알림 기능을 사용할 수 없는 브라우저입니다.");
     const permission=await Notification.requestPermission();if(permission!=="granted")throw new Error("알림 권한이 허용되지 않았습니다.");
     const {data:sessionData,error:sessionError}=await db.auth.getSession();if(sessionError)throw sessionError;
     const accessToken=sessionData.session?.access_token;if(!accessToken)throw new Error("로그인 세션을 확인할 수 없습니다.");
     const response=await fetch(URL_BASE+"/functions/v1/schedule-push",{method:"GET",headers:{apikey:KEY,Authorization:"Bearer "+accessToken}});
     const keyData=await response.json();if(!response.ok)throw new Error(keyData.error||"푸시 서버 설정을 확인해 주세요.");
     const registration=await navigator.serviceWorker.ready;
     let subscription=await registration.pushManager.getSubscription();
     if(!subscription)subscription=await registration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(keyData.publicKey)});
     const data=subscription.toJSON();const keys=data.keys||{};
     if(!data.endpoint||!keys.p256dh||!keys.auth)throw new Error("푸시 구독 정보를 읽지 못했습니다.");
     const {error:saveError}=await db.from("push_subscriptions").upsert({user_id:user.id,endpoint:data.endpoint,p256dh:keys.p256dh,auth:keys.auth,updated_at:new Date().toISOString()},{onConflict:"endpoint"});
     if(saveError)throw saveError;
     localStorage.setItem("mySchedulePushEnabled","true");
     status("푸시 알림 구독 완료 · 서버 발송 예약 설정은 별도 단계가 남아 있습니다.");
     alert("이 기기의 푸시 알림 구독이 완료됐습니다.");
   }catch(error){status("푸시 설정 실패: "+(error.message||String(error)));alert("푸시 알림 설정 실패: "+(error.message||String(error)));}
   finally{button.disabled=!user;}
 };
 if(!db){status("Supabase 라이브러리 로딩 실패");return;}
 db.auth.getSession().then(({data,error})=>{if(error)status(error.message);authState(data?.session)});
 db.auth.onAuthStateChange((_event,session)=>authState(session));
 el("cloudSignup").onclick=async()=>{const email=el("cloudEmail").value.trim(),password=el("cloudPassword").value;if(!email||password.length<6)return alert("이메일과 6자 이상 비밀번호를 입력해 주세요.");const {data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});if(error)return alert("회원가입 실패: "+error.message);if(data.session)authState(data.session);else status("인증 메일을 확인한 뒤 로그인해 주세요.")};
 el("cloudLogin").onclick=async()=>{const {data,error}=await db.auth.signInWithPassword({email:el("cloudEmail").value.trim(),password:el("cloudPassword").value});if(error)return alert("로그인 실패: "+error.message);authState(data.session)};
 el("cloudLogout").onclick=async()=>{const {error}=await db.auth.signOut();if(error)alert(error.message);else authState(null)};
 const toRow=e=>({id:e.id,user_id:user.id,title:e.title,description:null,starts_at:new Date(e.date+"T"+e.time+":00+09:00").toISOString(),timezone:"Asia/Seoul",repeat_rule:["none","daily","weekly","monthly"].includes(e.repeat)?e.repeat:"none",reminder_minutes:[Number(e.lead)||0],is_completed:!!e.done});
 const fromRow=r=>{const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date(r.starts_at));const v=Object.fromEntries(p.map(x=>[x.type,x.value]));return{id:r.id,title:r.title,date:v.year+"-"+v.month+"-"+v.day,time:v.hour+":"+v.minute,repeat:["none","daily","weekly","monthly"].includes(r.repeat_rule)?r.repeat_rule:"none",lead:Number(r.reminder_minutes?.[0]??0),done:!!r.is_completed}};
 async function sync(){if(!user)return;const button=el("cloudSync");button.disabled=true;status("동기화 중…");try{
   let changed=false;for(const e of entries)if(!isUuid(e.id)){e.id=crypto.randomUUID();changed=true;}if(changed)localStorage.setItem("myScheduleEntries",JSON.stringify(entries));
   const dirty=new Set(read(DIRTY)),deleted=read(DELETED);
   const {data:remote,error:readError}=await db.from("schedules").select("id,title,starts_at,repeat_rule,reminder_minutes,is_completed,deleted_at").eq("user_id",user.id);if(readError)throw readError;
   const remoteMap=new Map((remote||[]).map(r=>[r.id,r]));
   if(deleted.length){const {error}=await db.from("schedules").update({deleted_at:new Date().toISOString()}).eq("user_id",user.id).in("id",deleted);if(error)throw error;}
   const localMap=new Map(entries.map(e=>[e.id,e]));
   const toUpload=[];for(const [id,e] of localMap){const r=remoteMap.get(id);if(r?.deleted_at)continue;if(dirty.has(id)||!r)toUpload.push(toRow(e));}
   if(toUpload.length){const {error}=await db.from("schedules").upsert(toUpload,{onConflict:"id"});if(error)throw error;}
   const {data:latest,error:latestError}=await db.from("schedules").select("id,title,starts_at,repeat_rule,reminder_minutes,is_completed,deleted_at").eq("user_id",user.id);if(latestError)throw latestError;
   const next=(latest||[]).filter(r=>!r.deleted_at).map(fromRow);
   const deletedIds=new Set((latest||[]).filter(r=>r.deleted_at).map(r=>r.id));
   const retainedLocal=entries.filter(e=>!deletedIds.has(e.id)&&!next.some(n=>n.id===e.id)&&!remoteMap.has(e.id));
   entries=[...next,...retainedLocal];localStorage.setItem("myScheduleEntries",JSON.stringify(entries));write(DIRTY,[]);write(DELETED,[]);render();
   status("동기화 완료 · 일정 "+entries.length+"개");
 }catch(e){status("동기화 실패: "+(e.message||String(e)));}finally{button.disabled=!user}}
 el("cloudSync").onclick=()=>{busy=busy.then(sync).catch(()=>{})};
})();
</script>
</body></html>
